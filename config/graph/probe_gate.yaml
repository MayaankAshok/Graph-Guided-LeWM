defaults:
  - _self_
  - env: pusht

# E1 -- frozen-latent sufficiency probes (docs/gas-lewm-proposal.md).
# See scripts/probe_gate.py. Kill criterion: LeWM z must beat the raw-pixel floor on both
# probe A (state recovery) and probe C (metric-form temporal distance). If it does not, the
# frozen prior carries nothing GAS's TDR head could use and the rest of the ladder is moot.

n_episodes: 300      # 300 = the b0 gate's landmark subset. 18685 = the full Push-T h5
                     # (2,336,736 frames) -- set PROBE_CACHE_DIR to node-local scratch first,
                     # the full-scale memmap cache is ~5.5 GB and /home2 has a 30 GB quota.
train_frac: 0.8      # episode-level split, same convention as datatiers.py/idm_gate.py
seed: 0

arms: [lewm, pixels, randproj, state]
pixel_grid: 16       # OUTPUT side length: 16 -> 16x16x3 = 768-d, pooled in exact 14x14 blocks.
                     # Must divide 224. (An earlier version named this by BLOCK size, which
                     # silently produced a 14x14 grid instead -- hence the rename.)

# pair sampling for probes B and C
pairs_per_episode: 100
max_gap: 100         # Push-T episodes average ~125 steps; caps the heavy tail so the probe
                     # is not dominated by a handful of very long gaps

# probe head (identical across arms -- the comparison is the representation, nothing else)
hidden: 256
depth: 2
metric_dim: 64       # output dim of psi in probe C
n_steps: 20000
batch_size: 512
lr: 1e-3
n_train_eval: 100000 # train rows/pairs scored alongside test, to expose an underfit head
edge_thresholds: [5, 10, 25]   # GAS adds an edge iff predicted temporal distance < H_TD;
                               # precision/recall here is what that decision actually consumes
