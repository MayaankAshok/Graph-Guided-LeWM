# Per-environment tuning for the latent-graph pipeline (scripts/graph_gate.py,
# datatiers.py, worker.py, rollout_collector.py, actor_train.py, actor_rollout_eval.py).
# `name` selects common.envs.ENV_MECHANICS[name] for the parts that can't be pure config
# (oracle, live-env reset/step, noisy-rollout policy) -- see common/envs.py.
name: tworoom
output_prefix: tworoom   # outputs/b0_${output_prefix}, outputs/b3_${output_prefix}, etc.
id_edge_k: 4              # carried over unchanged from the B4-extension winner
# bruteforce: exact O(n^2) scan at the calibrated threshold -- Two-Room's calibration always
# succeeds, so this is what every historical Two-Room B0-B4 number was actually computed
# with. capped: k-capped FAISS with calibrated/heuristic-fallback (see graph_lib.
# build_identification_edges) -- proven to match-or-beat bruteforce on the real RL metric
# (see [[tworoom-b4-extension-edge-cap-rl]]) but NOT bit-identical to the historical numbers.
id_edge_method: bruteforce
# Historical accident, not a design choice: Two-Room's original B0 script had calibrate()
# and evaluate() sharing ONE module-level rng object (both lived in the same file), so
# evaluate()'s src/tgt sampling started from whatever state calibrate()'s own internal
# draws left it at. Push-T's original script never shared this (calibrate's rng was always
# separate), so this stays true only for tworoom -- set to reproduce the exact historical
# B0 numbers (euclidean=0.4394, graph=0.9515 at id_weight=1.0); has no effect on
# correctness, only on which specific eval pairs get sampled.
share_calibration_rng: true

n_episodes: 300            # B0 gate landmark count

mixed_n_expert: 50
mixed_n_noisy: 50
mixed_large_n_expert: 50
mixed_large_n_noisy: 220   # ~matches expert_100's frame count -- see tworoom_b3_mixed_large.py
rollout_policy_kwargs:
  action_noise: 0.4
  action_repeat_prob: 0.15

# LeWM paper live-eval protocol (App. F.1): goal = the dataset state paper_goal_offset
# timesteps later in the same trajectory, paper_eval_budget env steps to reach it. Used
# when actor.yaml's eval_protocol=same_episode. NOTE: every historical Two-Room
# actor-rollout number ([[tworoom-actor-rollout-sweep]], [[tworoom-b4ext-actor-rollout]])
# was measured under eval_protocol=cross_episode -- pass that explicitly to reproduce them.
paper_goal_offset: 100
paper_eval_budget: 150
