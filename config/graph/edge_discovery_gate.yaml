defaults:
  - _self_
  - env: tworoom

# E2 -- edge discovery + verification precision vs. the oracle
# (docs/graph-proposal/predictor-stitching.tex). See scripts/edge_discovery_gate.py.
n_episodes: 300      # matches graph_gate.py's/idm_gate.py's cached landmark set
train_frac: 0.8      # same episode-level split as idm_gate.py, for training the IDM ensemble

k_actions: 4          # candidate actions per landmark for predictor-based discovery --
                      # matches env.id_edge_k so the discovery and baseline kNN edges are
                      # compared at the same fan-out
error_floor_quantile: 0.9   # accept a discovered edge if its predicted-vs-actual squared
                            # error is under this quantile of the predictor's OWN error on
                            # real transitions -- see common.graph_lib.predictor_error_floor
n_oracle_sample: 3000       # cap on how many discovered/baseline edges get an oracle-distance
                            # lookup (each is a real Dijkstra call on Two-Room's grid oracle)
oracle_false_edge_threshold: 2   # "false edge" = true geodesic separation > this many real
                                  # environment steps, matching main.tex's own B0 convention

n_members: 6          # IDM ensemble, same architecture/training convention as idm_gate.py
hidden: 256
n_steps: 3000
batch_size: 256
lr: 1e-3
seed: 0
